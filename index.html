<style>

  .group-label{font-family:'Oswald';text-transform:uppercase;letter-spacing:.14em;font-size:.82rem;color:var(--gold);font-weight:500;white-space:nowrap;flex:none}

  .tab{padding:12px 14px;font-size:.86rem;border-radius:13px;justify-content:center;text-align:center;transition:transform .15s,background .18s,border-color .18s,color .18s}

  .group-body>.item:nth-child(5),.grid>.card:nth-child(5),.news>*:nth-child(5){animation-delay:.14s}

  .item{cursor:pointer}.item:hover{transform:translateY(-1px)}

    // PWA
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.remove('hidden');});
    document.getElementById('installBtn').onclick=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('installBtn').classList.add('hidden');}};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
