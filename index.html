<style>
  :root{--bg:#0A0D18;--surface:#141A2C;--surface-2:#1B2238;--line:#28314E;--text:#EAE8F2;--muted:#8B92AC;--faint:#5C637E;--gold:#E7B75F;--gold-soft:rgba(231,183,95,.14);--gold-line:rgba(231,183,95,.4);--emerald:#2FB98A;--violet:#9B8CE0;--violet-line:rgba(155,140,224,.35);--box:#0d1120}

  .stars{display:flex;gap:1px}.star{width:15px;height:15px;cursor:pointer;color:var(--faint)}.star svg{width:15px;height:15px;fill:currentColor;display:block}.star.fill{color:var(--gold)}.star:hover{color:var(--gold)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:11px}
  .card{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:11px;overflow:hidden;transition:border-color .2s,opacity .3s}.card:hover{border-color:#374267}.card.done{opacity:.55}.card.upcoming{opacity:.75}.card.essential{border-color:var(--gold-line)}
  .cardposter{position:relative;aspect-ratio:2/3;background:var(--box) center/cover no-repeat;cursor:pointer}.cardposter.ph{background:linear-gradient(160deg,var(--surface-2),var(--box))}
  .check.ov{position:absolute;top:6px;left:6px;width:24px;height:24px}.bm.ov{position:absolute;top:6px;right:6px;width:24px;height:24px}.card.upcoming .check.ov{pointer-events:none;opacity:.4}
  .cardidx{position:absolute;top:6px;left:50%;transform:translateX(-50%);font-family:'Oswald';font-size:.7rem;color:#fff;background:rgba(155,140,224,.9);border-radius:6px;padding:1px 7px}
  .cardrate{position:absolute;bottom:6px;left:6px;font-family:'Oswald';font-size:.66rem;color:var(--gold);background:rgba(10,13,24,.82);border:1px solid var(--gold-line);border-radius:6px;padding:2px 6px}
  .cardmeta{padding:8px 9px;cursor:pointer}.cardtitle{font-size:.8rem;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.card.done .cardtitle{text-decoration:line-through}.cardyr{font-size:.72rem;color:var(--faint);margin-top:2px}
  .empty{text-align:center;color:var(--muted);padding:38px 20px;font-size:.9rem;border:1px dashed var(--line);border-radius:12px}
  footer{text-align:center;color:var(--faint);font-size:.74rem;margin-top:28px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--surface-2);border:1px solid var(--gold-line);color:var(--text);padding:11px 20px;border-radius:12px;font-size:.85rem;font-weight:500;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:80;box-shadow:0 10px 30px -8px rgba(0,0,0,.6)}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .hidden{display:none !important}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(5,7,14,.72);backdrop-filter:blur(3px);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow-y:auto}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;max-width:560px;width:100%;margin:24px auto;overflow:hidden;position:relative}

  .cmp-in{width:100%;background:var(--box);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:.82rem;padding:10px;margin:8px 0;font-family:monospace}
  .cmp-res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
  @media (max-width:520px){.item{padding:11px 12px}.rowctl{gap:6px}.theme-btn,.install-btn{position:static;margin:8px 4px 0;display:inline-block;vertical-align:middle}header{padding-top:26px}}
  @media (prefers-reduced-motion:reduce){*{transition:none !important}}

<body>
<div class="wrap">
  <header>
    <button class="install-btn hidden" id="installBtn">Install app</button>
    <button class="theme-btn" id="themeBtn" title="Toggle theme">◐</button>
    <div class="eyebrow" id="eyebrow">Marvel</div><h1>Watch Tracker</h1><p class="lede" id="lede"></p>
  </header>
  <div class="panel">
    <div class="panel-top"><div class="panel-count"><b id="watched">0</b> of <span id="total">0</span> watched</div><div class="panel-pct" id="pct">0%</div></div>
    <div class="bar"><div class="bar-fill" id="barfill"></div></div>
    <div class="sub-line"><span><b id="released">0</b> released</span><span><b id="upcoming">0</b> upcoming</span><span><b id="wl">0</b> watchlist</span><span><b id="avail">0</b> on EG streaming</span></div>
    <div class="uni-stats" id="uniStats"></div>
  </div>
  <input class="search" id="search" type="search" placeholder="Search all titles…" autocomplete="off" />
  <div class="tabs" id="uniTabs"></div>
  <div class="subtabs" id="subTabs"></div>
  <div class="filters" id="filters"></div>
  <div class="tools" id="tools"></div>
  <div class="statspanel hidden" id="statsPanel"></div>
  <noscript><div class="empty">This tracker needs JavaScript. Open it in a browser.</div></noscript>
  <div id="list"></div>
  <footer id="foot"></footer>
</div>
<div class="toast" id="toast"></div>
<div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
<script src="data.js"></script>
<script>
(function(){
  const CHECK=`<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>`;
  const BM=`<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>`;
  const STAR=`<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>`;
  const STORE='mcu_tracker_v3';
  let state={done:{},watchlist:{},ratings:{},collapsed:{},uni:null,sub:'all',type:'all',status:'all',flags:{watchlist:false,essential:false,availEG:false,newEG:false},q:'',view:'list',sort:'release',story:false,theme:'dark'};
  let toastT,deferredPrompt=null;
  function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200);}
  function load(){try{const r=localStorage.getItem(STORE);if(r){const s=JSON.parse(r);Object.assign(state,s);state.flags=Object.assign({watchlist:false,essential:false,availEG:false,newEG:false},s.flags||{});return;}const old=localStorage.getItem('mcu_tracker_v2')||localStorage.getItem('mcu_tracker_v1');if(old){const s=JSON.parse(old);state.done=s.done||{};state.watchlist=s.watchlist||{};state.ratings=s.ratings||{};}}catch(e){}}

  function activeCount(){let n=0;if(state.type!=='all')n++;if(state.status!=='all')n++;Object.keys(state.flags).forEach(k=>{if(state.flags[k])n++;});if(state.q)n++;return n;}
  function matches(it){

  function sortItems(items){const a=items.slice(),r=state.sort;

    else if(r==='unwatched')a.sort((x,y)=>{const dx=(state.done[x.id]||x._up)?1:0,dy=(state.done[y.id]||y._up)?1:0;return(dx-dy)||(x._rt-y._rt);});
    else a.sort((x,y)=>x._rt-y._rt);return a;}

  function render(){

      const label=(uid==='MCU')?'Story order — chronological':'By release order';let n=0;

    openDetail(pool[Math.floor(Math.random()*pool.length)].id);
  }
  // ---- progress code + compare ----
  var ID_ORDER=DATA.map(d=>d.id).slice().sort();
  function b64url(b){var s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function unb64url(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var bin=atob(str),o=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o;}
  function genCode(map){var b=new Uint8Array(Math.ceil(ID_ORDER.length/8));ID_ORDER.forEach((id,i)=>{if(map[id])b[i>>3]|=(1<<(i&7));});return b64url(b);}
  function decodeCode(code){var b=unb64url(code),set={};ID_ORDER.forEach((id,i)=>{if(b[i>>3]&(1<<(i&7)))set[id]=true;});return set;}
  function applyCode(code){try{var s=decodeCode(code);ID_ORDER.forEach(id=>{if(s[id])state.done[id]=true;else delete state.done[id];});return true;}catch(e){return false;}}
  function copyProgressLink(){var url=location.origin+location.pathname+'#p='+genCode(state.done);if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Progress link copied!'),()=>toast('Copy failed.'));else toast('Copy: '+url);}
  function openCompare(){
    document.getElementById('modal').innerHTML=
      '<button class="close" id="mClose">\u2715</button><div class="mbody" style="padding-top:18px">'+
      '<div class="mtitle" style="font-size:1.1rem">Compare with a friend</div>'+
      '<div class="mmeta">Paste a friend\u2019s progress code (from their "Copy progress" link, the part after <code>#p=</code>) to see how you compare.</div>'+
      '<input class="cmp-in" id="cmpIn" placeholder="paste code here" />'+
      '<button class="mbtn" id="cmpGo">Compare</button>'+
      '<div id="cmpOut"></div>'+
      '<div class="mmeta" style="margin-top:12px">Your code: <code style="word-break:break-all">'+genCode(state.done)+'</code></div></div>';
    document.getElementById('overlay').classList.remove('hidden');
    document.getElementById('mClose').onclick=closeModal;
    document.getElementById('cmpGo').onclick=()=>{
      let code=document.getElementById('cmpIn').value.trim();const m=code.match(/#p=(.+)$/);if(m)code=m[1];
      let friend;try{friend=decodeCode(code);}catch(e){document.getElementById('cmpOut').innerHTML='<div class="mmeta" style="color:#ff9a9a">Could not read that code.</div>';return;}
      const rel=DATA.filter(i=>!i._up);
      const both=rel.filter(i=>state.done[i.id]&&friend[i.id]);
      const youOnly=rel.filter(i=>state.done[i.id]&&!friend[i.id]);
      const friendOnly=rel.filter(i=>!state.done[i.id]&&friend[i.id]);
      const list=arr=>arr.slice(0,8).map(i=>i.title).join(', ')+(arr.length>8?(' +'+(arr.length-8)+' more'):'');
      document.getElementById('cmpOut').innerHTML=
        '<div class="cmp-res"><div class="statbox"><b>'+both.length+'</b><span>both seen</span></div><div class="statbox"><b>'+youOnly.length+'</b><span>only you</span></div><div class="statbox"><b>'+friendOnly.length+'</b><span>only them</span></div></div>'+
        (friendOnly.length?'<div class="msec">They\u2019ve seen, you haven\u2019t</div><div class="mmeta">'+list(friendOnly)+'</div>':'')+
        (youOnly.length?'<div class="msec">You\u2019ve seen, they haven\u2019t</div><div class="mmeta">'+list(youOnly)+'</div>':'');
    };
  }
  let celebrated=false;
  function celebrate(){const rel=DATA.filter(i=>!i._up),w=rel.filter(i=>state.done[i.id]).length;if(rel.length&&w===rel.length&&!celebrated){celebrated=true;toast('\uD83C\uDF89 100% \u2014 every released title watched!');}if(w<rel.length)celebrated=false;}
  function shareApp(){const url=location.href,d={title:'Marvel Watch Tracker',text:'Track every Marvel film and series across the MCU and beyond.',url:url};if(navigator.share){navigator.share(d).catch(()=>{});return;}if(navigator.clipboard)navigator.clipboard.writeText(url).then(()=>toast('Link copied!'),()=>toast('Copy this URL.'));else toast('Copy this URL.');}
  function setTheme(t){state.theme=t;document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t==='light'?'#F4F5FA':'#0A0D18');}
  function init(){
    if(!window.MCU_DATA){document.getElementById('list').innerHTML='<div class="empty">Could not load data.js.</div>';return;}
    load();
    if(!state.uni||!U[state.uni])state.uni=uniOrder[0];
    if(state.sub!=='all'&&!(U[state.uni].subs[state.sub]))state.sub='all';
    setTheme(state.theme||'dark');
    document.getElementById('themeBtn').onclick=()=>{setTheme(state.theme==='light'?'dark':'light');save();};
    document.getElementById('eyebrow').textContent=CFG.title||'Marvel';
    document.getElementById('lede').textContent=CFG.subtitle||'';
    const s=document.getElementById('search');s.value=state.q||'';s.oninput=()=>{state.q=s.value.trim().toLowerCase();buildFilters();render();};
    const up=CFG.updated?(' \u00B7 data '+CFG.updated):'';
    document.getElementById('foot').innerHTML='Progress saves privately in your browser'+up+'. Tap a title for details, trailer, and where to watch.';
    if(location.hash&&location.hash.indexOf('#p=')===0){var code=location.hash.slice(3);if(code&&confirm('Load watched progress from this link? Replaces your current watched list.')){applyCode(code);save();}if(history.replaceState)history.replaceState(null,'',location.pathname+location.search);}
    buildFilters();buildTools();renderTabsAndList();
    // PWA
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.remove('hidden');});
    document.getElementById('installBtn').onclick=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('installBtn').classList.add('hidden');}};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
