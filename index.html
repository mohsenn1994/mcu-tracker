<body>

</div>
<div class="toast" id="toast"></div>
<div class="overlay hidden" id="overlay"><div class="modal" id="modal"></div></div>
<script src="data.js"></script>
<script>
(function(){
  const CHECK=`<svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg>`;
  const BM=`<svg viewBox="0 0 24 24"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg>`;
  const STAR=`<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>`;
  const STORE='mcu_tracker_v3';
  let state={done:{},watchlist:{},ratings:{},seasons:{},eps:{},knownIds:[],collapsed:{},upFilter:'all',uni:null,sub:'all',type:'all',status:'all',flags:{watchlist:false,essential:false},q:'',view:'list',sort:'release',story:false,theme:'dark'};
  let toastT,deferredPrompt=null;
  function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('show'),2200);}
  function load(){try{const r=localStorage.getItem(STORE);if(r){const s=JSON.parse(r);Object.assign(state,s);state.flags=Object.assign({watchlist:false,essential:false},s.flags||{});state.seasons=s.seasons||{};state.eps=s.eps||{};state.knownIds=s.knownIds||[];state.upFilter=s.upFilter||'all';return;}const old=localStorage.getItem('mcu_tracker_v2')||localStorage.getItem('mcu_tracker_v1');if(old){const s=JSON.parse(old);state.done=s.done||{};state.watchlist=s.watchlist||{};state.ratings=s.ratings||{};}}catch(e){}}
  function save(){try{localStorage.setItem(STORE,JSON.stringify(state));}catch(e){}}
  const DATA=(window.MCU_DATA||[]).slice();
  const CFG=window.MCU_CONFIG||{};
  const UNI=CFG.universes||[{id:'MCU',short:'MCU',label:'MCU'}];
  const uniById={};UNI.forEach(u=>uniById[u.id]=u);
  const byId={};DATA.forEach(d=>byId[d.id]=d);
  const TODAY=new Date();
  function relDate(it){return it.release?new Date((it.release.length===4?it.release+'-12-31':it.release)+'T00:00:00'):new Date(it.year,11,31);}
  DATA.forEach(it=>{it.universe=it.universe||'MCU';it._up=relDate(it)>TODAY;it._rt=relDate(it).getTime();it._avail=!!(it.watch&&it.watch.flatrate&&it.watch.flatrate.length);});
  function newsOnly(it){return !!it.discovered || (it.universe==='MCU' && !it.phase);}
  function inNews(it){return it._up || (newsOnly(it) && !it.release);}
  const TRACK=DATA.filter(i=>!newsOnly(i));
  function ordv(list,name){const i=(list||[]).indexOf(name);return i===-1?900+String(name).length:i;}
  const U={};UNI.forEach(u=>U[u.id]={def:u,items:[],subs:{},subOrder:[]});
  DATA.forEach(it=>{if(newsOnly(it))return;if(!U[it.universe])U[it.universe]={def:{id:it.universe,short:it.universe,label:it.universe},items:[],subs:{},subOrder:[]};U[it.universe].items.push(it);});
  Object.keys(U).forEach(uid=>{const isMCU=uid==='MCU';U[uid].items.forEach(it=>{const k=isMCU?(it.phase||'—'):(it.saga||'—');(U[uid].subs[k]=U[uid].subs[k]||[]).push(it);});U[uid].subOrder=Object.keys(U[uid].subs).sort((a,b)=>isMCU?ordv(CFG.phaseOrder,a)-ordv(CFG.phaseOrder,b):ordv(CFG.sagaOrder,a)-ordv(CFG.sagaOrder,b));Object.keys(U[uid].subs).forEach(k=>U[uid].subs[k].sort((a,b)=>a._rt-b._rt));});
  const uniOrder=UNI.map(u=>u.id).filter(id=>U[id]).concat(Object.keys(U).filter(id=>!uniById[id]));
  uniById['NEWS']={id:'NEWS',short:'Upcoming',label:'Upcoming & Announcements'};
  uniOrder.push('NEWS');
  const relOf=items=>items.filter(i=>!i._up);
  function epsInSeason(it,n){var se=(it.seasons||[]).find(function(s){return s.n===n;});return se?(se.eps||0):0;}
  function seasonCount(it,n){return (state.eps[it.id]&&state.eps[it.id][n])||0;}
  function setSeasonCount(it,n,c){if(!state.eps[it.id])state.eps[it.id]={};var mx=epsInSeason(it,n);c=Math.max(0,Math.min(c,mx));if(c<=0)delete state.eps[it.id][n];else state.eps[it.id][n]=c;if(state.eps[it.id]&&!Object.keys(state.eps[it.id]).length)delete state.eps[it.id];syncDone(it);}
  function setSeason(it,n,on){setSeasonCount(it,n,on?epsInSeason(it,n):0);}
  function seasonsWatched(it){if(!it.seasons)return 0;return it.seasons.filter(function(se){return seasonCount(it,se.n)>=se.eps&&se.eps>0;}).length;}
  function isFullyWatched(it){ if(it.seasons&&it.seasons.length){return it.seasons.every(function(se){return seasonCount(it,se.n)>=se.eps;});} return !!state.done[it.id]; }
  function syncDone(it){ if(it.seasons&&it.seasons.length){ if(isFullyWatched(it))state.done[it.id]=true; else delete state.done[it.id]; } }
  function epsWatched(it){ if(!it.seasons)return 0; return it.seasons.reduce(function(a,se){return a+Math.min(seasonCount(it,se.n),se.eps);},0); }
  function itemHours(it){ if(it.seasons&&it.seasons.length&&it.runtime){var tot=it.seasons.reduce(function(a,se){return a+(se.eps||0);},0);return tot*it.runtime/60;} return (it.runtime||0)/60; }
  function uniCounts(uid){if(uid==='NEWS'){return{done:DATA.filter(inNews).length,total:null};}const rel=relOf(U[uid].items);return{done:rel.filter(i=>isFullyWatched(i)).length,total:rel.length};}
  function subCounts(uid,key){const rel=relOf(U[uid].subs[key]||[]);return{done:rel.filter(i=>isFullyWatched(i)).length,total:rel.length};}
  function activeCount(){let n=0;if(state.type!=='all')n++;if(state.status!=='all')n++;Object.keys(state.flags).forEach(k=>{if(state.flags[k])n++;});if(state.q)n++;return n;}
  function matches(it){
    if(state.type==='movie'&&it.type!=='movie')return false;
    if(state.type==='series'&&it.type==='movie')return false;
    if(state.status==='watched'&&!state.done[it.id])return false;
    if(state.status==='towatch'&&(state.done[it.id]||it._up))return false;
    if(state.flags.watchlist&&!state.watchlist[it.id])return false;
    if(state.flags.essential&&!it.essential)return false;
    if(state.q&&it.title.toLowerCase().indexOf(state.q)===-1)return false;
    return true;
  }
  function sortItems(items){const a=items.slice(),r=state.sort;
    if(r==='az')a.sort((x,y)=>x.title.localeCompare(y.title));
    else if(r==='rating')a.sort((x,y)=>((y.rating||0)-(x.rating||0))||(x._rt-y._rt));
    else if(r==='runtime')a.sort((x,y)=>((y.runtime||0)-(x.runtime||0))||(x._rt-y._rt));
    else if(r==='unwatched')a.sort((x,y)=>{const dx=(state.done[x.id]||x._up)?1:0,dy=(state.done[y.id]||y._up)?1:0;return(dx-dy)||(x._rt-y._rt);});
    else a.sort((x,y)=>x._rt-y._rt);return a;}
  const storySort=items=>items.slice().sort((x,y)=>((x.chrono||1e9)-(y.chrono||1e9))||(x._rt-y._rt));
  function starW(it){const r=state.ratings[it.id]||0;let s='<span class="stars" data-id="'+it.id+'">';for(let n=1;n<=5;n++)s+='<span class="star'+(n<=r?' fill':'')+'" data-id="'+it.id+'" data-n="'+n+'" role="button" tabindex="0">'+STAR+'</span>';return s+'</span>';}
  function tagFor(it){let t='<span class="tag">'+(it.type==='movie'?'Film':it.type==='special'?'Special':'Series')+'</span>';if(it.essential)t+='<span class="tag ess">Essential</span>';if(it._up)t+='<span class="tag up">Upcoming</span>';if(it.newlyAvailable&&!it._up)t+='<span class="tag neweg">New in EG</span>';if(window.__NEW&&window.__NEW[it.id])t+='<span class="tag newbadge">New</span>';if(it.rating)t+='<span class="tag">\u2605 '+it.rating+'</span>';if(it.runtime)t+='<span class="tag">'+it.runtime+'m</span>';return t;}
  var EXPANDED={};
  function seasonsBlock(it){
    if(!(it.seasons&&it.seasons.length))return '';
    var n=seasonsWatched(it);
    var rows=it.seasons.map(function(se){
      var cnt=seasonCount(it,se.n), full=cnt>=se.eps&&se.eps>0;
      var dots='';for(var k=1;k<=se.eps;k++){dots+='<span class="ep'+(k<=cnt?' on':'')+'" data-eid="'+it.id+'" data-esn="'+se.n+'" data-ek="'+k+'">'+k+'</span>';}
      return '<div class="seasonrow'+(full?' on':'')+'"><div class="sch" role="checkbox" aria-checked="'+full+'" tabindex="0" data-sid="'+it.id+'" data-sn="'+se.n+'">'+CHECK+'</div><span class="sname">'+se.name+'</span><span class="seps">'+cnt+'/'+se.eps+' ep'+(se.eps===1?'':'s')+'</span></div><div class="eps">'+dots+'</div>';
    }).join('');
    return '<button class="seasontoggle" data-exp="'+it.id+'">'+(n>0?(n+'/'+it.seasons.length+' seasons \u25BE'):('Track seasons & episodes ('+it.seasons.length+') \u25BE'))+'</button>'+
           '<div class="seasons">'+rows+'</div>';
  }
  function itemHTML(it,idx){
    const hasSeasons=!!(it.seasons&&it.seasons.length);
    const done=isFullyWatched(it),bm=!!state.watchlist[it.id];
    const poster=it.poster?'<div class="poster" style="background-image:url('+it.poster+')"></div>':'<div class="poster ph"></div>';
    const desc=it.overview||it.notes||'';
    let links='';
    if(it.imdb)links+='<a class="lnk" href="'+it.imdb+'" target="_blank" rel="noopener">IMDb \u2197</a>';
    return '<div class="item'+(done?' done':'')+(it.essential?' essential':'')+(it._up?' upcoming':'')+(EXPANDED[it.id]?' expanded':'')+'" data-open="'+it.id+'">'+
      (idx?'<div class="idx">'+idx+'</div>':'')+
      '<div class="check" role="checkbox" aria-checked="'+done+'" tabindex="0" data-id="'+it.id+'">'+CHECK+'</div>'+poster+
      '<div class="body"><div class="row1"><span class="title">'+it.title+'</span><span class="yr">'+it.year+'</span></div>'+
      (desc?'<div class="why">'+desc+'</div>':'')+'<div class="tags">'+tagFor(it)+'</div>'+(links?'<div class="links">'+links+'</div>':'')+seasonsBlock(it)+'</div>'+
      '<div class="rowctl"><div class="bm'+(bm?' on':'')+'" role="button" tabindex="0" data-bm="'+it.id+'" title="Watchlist">'+BM+'</div>'+(it._up?'':starW(it))+'</div></div>';
  }
  function cardHTML(it,idx){
    const done=isFullyWatched(it),bm=!!state.watchlist[it.id];
    const pos=it.poster?('style="background-image:url('+it.poster+')"'):'';
    return '<div class="card'+(done?' done':'')+(it.essential?' essential':'')+(it._up?' upcoming':'')+'" data-open="'+it.id+'">'+
      '<div class="cardposter'+(it.poster?'':' ph')+'" '+pos+'>'+
        '<div class="check ov" role="checkbox" aria-checked="'+done+'" tabindex="0" data-id="'+it.id+'">'+CHECK+'</div>'+
        '<div class="bm ov'+(bm?' on':'')+'" role="button" tabindex="0" data-bm="'+it.id+'">'+BM+'</div>'+
        (idx?'<span class="cardidx">'+idx+'</span>':'')+(it.rating?'<span class="cardrate">\u2605 '+it.rating+'</span>':'')+
      '</div><div class="cardmeta"><div class="cardtitle">'+it.title+'</div><div class="cardyr">'+it.year+'</div></div></div>';
  }
  function render(){
    const list=document.getElementById('list'),uid=state.uni;
    if(uid==='NEWS'){renderNews();return;}
    const u=U[uid];
    if(state.story){
      const vis=storySort(u.items.filter(matches));
      if(!vis.length){list.innerHTML='<div class="empty">No titles match your filters.</div>';bind();updateStats();return;}
      const label=(uid==='MCU')?'Story order — chronological':'By release order';let n=0;
      const body=state.view==='grid'?'<div class="grid">'+vis.map(it=>cardHTML(it,++n)).join('')+'</div>':vis.map(it=>itemHTML(it,++n)).join('');
      list.innerHTML='<div class="group"><div class="group-head" style="cursor:default"><span class="group-label">'+label+'</span><span class="group-count">'+vis.length+' titles</span></div><div class="group-body">'+body+'</div></div>';
      bind();updateStats();return;
    }
    const subs=u.subOrder;let html='',anything=false;
    subs.forEach(key=>{
      if(!u.subs[key])return;const all=u.subs[key],vis=all.filter(matches);if(!vis.length)return;anything=true;
      const rel=relOf(all),done=rel.filter(i=>isFullyWatched(i)).length,pct=rel.length?Math.round(done/rel.length*100):0;
      const sorted=sortItems(vis),collapsed=!!state.collapsed[uid+'/'+key];
      const ghours=Math.round(rel.reduce((a,i)=>a+itemHours(i),0));
      const body=state.view==='grid'?'<div class="grid">'+sorted.map(it=>cardHTML(it)).join('')+'</div>':sorted.map(it=>itemHTML(it)).join('');
      html+='<div class="group'+(collapsed?' collapsed':'')+'" data-gkey="'+encodeURIComponent(key)+'"><div class="group-head" data-toggle="'+encodeURIComponent(key)+'"><span class="chev">\u25BC</span><span class="group-label">'+key+'</span><span class="group-mini"><i style="width:'+pct+'%"></i></span><span class="group-count">'+done+'/'+rel.length+(ghours?(' \u00B7 ~'+ghours+'h'):'')+'</span><button class="markall" data-group="'+encodeURIComponent(key)+'">'+(done>=rel.length&&rel.length?'Unmark all':'Mark all')+'</button></div><div class="group-body">'+body+'</div></div>';
    });
    list.innerHTML=anything?html:'<div class="empty">No titles match your filters here.</div>';
    bind();updateStats();
  }
  function bind(){
    document.querySelectorAll('.check').forEach(c=>{const t=e=>{e&&e.stopPropagation();const row=c.closest('.item,.card');if(row.classList.contains('upcoming'))return;const id=c.dataset.id;const it=byId[id];if(it&&it.seasons&&it.seasons.length){const full=isFullyWatched(it);it.seasons.forEach(se=>setSeason(it,se.n,!full));}else{if(state.done[id])delete state.done[id];else state.done[id]=true;}row.classList.toggle('done',isFullyWatched(it||{id:id}));c.setAttribute('aria-checked',row.classList.contains('done'));c.classList.add('pop');setTimeout(()=>c.classList.remove('pop'),300);save();refreshCounts();celebrate();if(it&&it.seasons&&it.seasons.length)render();};c.onclick=t;c.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t(e);}};});
    document.querySelectorAll('.bm').forEach(b=>{const t=e=>{e&&e.stopPropagation();const id=b.dataset.bm;if(state.watchlist[id])delete state.watchlist[id];else state.watchlist[id]=true;b.classList.toggle('on');save();refreshCounts();};b.onclick=t;b.onkeydown=e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();t(e);}};});
    document.querySelectorAll('.star').forEach(s=>{s.onclick=e=>{e.stopPropagation();const id=s.dataset.id,n=+s.dataset.n;if((state.ratings[id]||0)===n)delete state.ratings[id];else state.ratings[id]=n;const cur=state.ratings[id]||0;s.parentNode.querySelectorAll('.star').forEach(x=>x.classList.toggle('fill',(+x.dataset.n)<=cur));save();};});
    document.querySelectorAll('.markall').forEach(m=>{m.onclick=e=>{e.stopPropagation();const key=decodeURIComponent(m.dataset.group);const rel=relOf(U[state.uni].subs[key]||[]);const allDone=rel.every(i=>state.done[i.id]);rel.forEach(i=>{if(allDone)delete state.done[i.id];else state.done[i.id]=true;});save();render();};});
    document.querySelectorAll('.group-head[data-toggle]').forEach(h=>{h.onclick=()=>{const key=decodeURIComponent(h.dataset.toggle),k=state.uni+'/'+key;state.collapsed[k]=!state.collapsed[k];save();h.closest('.group').classList.toggle('collapsed',state.collapsed[k]);};});

  function b64url(b){var s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
  function unb64url(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';var bin=atob(str),o=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)o[i]=bin.charCodeAt(i);return o;}

    buildFilters();buildTools();renderTabsAndList();
    // PWA
    if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{});}
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;document.getElementById('installBtn').classList.remove('hidden');});
    document.getElementById('installBtn').onclick=()=>{if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('installBtn').classList.add('hidden');}};
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
})();
</script>
</body>
</html>
